name: build

on:
  push:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/clore-miner:latest
            ghcr.io/${{ github.repository_owner }}/clore-miner:${{ github.sha }}
      - uses: docker/build-push-action@v6
        with:
          context: krig
          platforms: linux/amd64
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/clore-miner:krig
            ghcr.io/${{ github.repository_owner }}/clore-miner:krig-${{ github.sha }}
