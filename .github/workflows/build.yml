name: build

on:
  push:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  image:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - target: srb
            tags: |
              ghcr.io/${{ github.repository_owner }}/clore-miner:latest
              ghcr.io/${{ github.repository_owner }}/clore-miner:${{ github.sha }}
          - target: wildrig
            tags: |
              ghcr.io/${{ github.repository_owner }}/clore-miner:wildrig
              ghcr.io/${{ github.repository_owner }}/clore-miner:wildrig-${{ github.sha }}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          target: ${{ matrix.target }}
          platforms: linux/amd64
          push: true
          tags: ${{ matrix.tags }}
