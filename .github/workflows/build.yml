name: build

on:
  push:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  image:
    runs-on: ubuntu-latest
    strategy:
      # one miner's release gone upstream (fl4sh 1.4.4 -- 404 on 02.10) must not cancel the others
      fail-fast: false
      matrix:
        include:
          - target: srb-peak
            float: srb-peak
            prefix: srb-peak-
          - target: srb          # the fleet's first image: :latest and the bare sha (ops/clore_orders.IMAGE)
            float: latest
            prefix: ""
          - target: peak
            float: peak
            prefix: peak-
          - target: forge
            float: forge
            prefix: forge-
          - target: bz
            float: bz
            prefix: bz-
          - target: rg
            float: rg
            prefix: rg-
          - target: fl4sh
            float: fl4sh
            prefix: fl4sh-
          - target: krig
            float: krig
            prefix: krig-
          - target: qp
            float: qp
            prefix: qp-
          - target: own
            float: own
            prefix: own-
          - target: own-prof     # own + ncu (Nsight Compute 2024.3, CUDA 12.6): the kernel bench with --profile
            float: own-prof
            prefix: own-prof-
    steps:
      - uses: actions/checkout@v4
      # The floating tag (:latest, :<target>) is what an unpinned order pulls: only the image branch moves it. Any other
      # branch publishes the pinned <target>-<sha> alone, so a trial build never replaces what the fleet may run.
      - id: tags
        env:
          IMAGE: ghcr.io/${{ github.repository_owner }}/clore-miner
          PINNED: ${{ matrix.prefix }}${{ github.sha }}
          FLOAT: ${{ matrix.float }}
        run: |
          tags="$IMAGE:$PINNED"
          if [ "$GITHUB_REF" = refs/heads/image ]; then tags="$tags,$IMAGE:$FLOAT"; fi
          echo "tags: $tags"
          echo "tags=$tags" >> "$GITHUB_OUTPUT"
      # the two CUDA devel stages of own and own-prof (nvidia/cuda 12.6 for v100, 12.8 for soat, ~8 GB unpacked each)
      # do not fit the runner's free disk otherwise
      - if: startsWith(matrix.target, 'own')
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache /usr/local/share/boost \
            /usr/share/swift /usr/local/.ghcup /usr/local/share/powershell /usr/local/share/chromium
          docker image prune -af
          df -h /
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          target: ${{ matrix.target }}
          platforms: linux/amd64
          push: true
          tags: ${{ steps.tags.outputs.tags }}
