name: build

on:
  push:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  image:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - target: srb
            tags: |
              ghcr.io/${{ github.repository_owner }}/clore-miner:latest
              ghcr.io/${{ github.repository_owner }}/clore-miner:${{ github.sha }}
          - target: peak
            tags: |
              ghcr.io/${{ github.repository_owner }}/clore-miner:peak
              ghcr.io/${{ github.repository_owner }}/clore-miner:peak-${{ github.sha }}
          - target: forge
            tags: |
              ghcr.io/${{ github.repository_owner }}/clore-miner:forge
              ghcr.io/${{ github.repository_owner }}/clore-miner:forge-${{ github.sha }}
          - target: bz
            tags: |
              ghcr.io/${{ github.repository_owner }}/clore-miner:bz
              ghcr.io/${{ github.repository_owner }}/clore-miner:bz-${{ github.sha }}
          - target: rg
            tags: |
              ghcr.io/${{ github.repository_owner }}/clore-miner:rg
              ghcr.io/${{ github.repository_owner }}/clore-miner:rg-${{ github.sha }}
          - target: fl4sh
            tags: |
              ghcr.io/${{ github.repository_owner }}/clore-miner:fl4sh
              ghcr.io/${{ github.repository_owner }}/clore-miner:fl4sh-${{ github.sha }}
          - target: krig
            tags: |
              ghcr.io/${{ github.repository_owner }}/clore-miner:krig
              ghcr.io/${{ github.repository_owner }}/clore-miner:krig-${{ github.sha }}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          target: ${{ matrix.target }}
          platforms: linux/amd64
          push: true
          tags: ${{ matrix.tags }}
